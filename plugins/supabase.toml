[plugin]
name = "supabase"
alias = ["supabase", "supabase-cli"]
description = "The Supabase CLI for local development, migrations, and project management"
location = "github:supabase/cli"
asset_pattern = "supabase_{version}_{target}.tar.gz"
checksum_asset_pattern = "checksums.txt"
binary = "supabase"
man_pages = []

[plugin.targets]
"linux-x86_64" = "linux_amd64"
"linux-aarch64" = "linux_arm64"
"macos-x86_64" = "darwin_amd64"
"macos-aarch64" = "darwin_arm64"
"windows-x86_64" = "windows_amd64"
"windows-aarch64" = "windows_arm64"
