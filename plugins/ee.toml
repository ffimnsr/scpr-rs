[plugin]
name = "ee"
alias = ["ee"]
description = "A quick simple editor for your needs. Aims to be smooth like butter when opening large files."
location = "github:ffimnsr/ee"
asset_pattern = "ee-{version}-{target}.tar.gz"
checksum_asset_pattern = "ee-{version}-{target}.tar.gz.sha256"
binary = "ee-{version}-{target}/ee"
man_pages = []

# The release archive also ships the OpenRouter ACP agent binary, the
# tree-sitter runtime, and the bundled xi-lsp plugin. These mappings mirror
# the upstream install.sh layout (the plugins subtree intentionally lands in
# both the data home and the config home, as the official installer does).
[[plugin.files]]
from = "ee-{version}-{target}/ee-openrouter-agent"
to = "{install_dir}/ee-openrouter-agent"
executable = true

[[plugin.files]]
from = "ee-{version}-{target}/share/ee"
to = "{data_home}/ee"

[[plugin.files]]
from = "ee-{version}-{target}/share/ee/plugins"
to = "{config_home}/ee/plugins"

[plugin.completions]
command = "{binary_path} do completions {shell}"

[plugin.targets]
"linux-x86_64" = "x86_64-unknown-linux-musl"
"macos-aarch64" = "aarch64-apple-darwin"
