[plugin]
name = "yazi"
alias = ["yazi"]
description = "A small CLI utility: yazi"
location = "github:sxyazi/yazi"
asset_pattern = "yazi-v{version}-{target}.tar.gz"
allow_insecure_no_checksum = true
binary = "yazi-v{version}-{target}/yazi"
man_pages = []

[plugin.targets]
"linux-x86_64" = "x86_64-unknown-linux-musl"
"linux-aarch64" = "aarch64-unknown-linux-musl"
"macos-x86_64" = "x86_64-apple-darwin"
"macos-aarch64" = "aarch64-apple-darwin"
